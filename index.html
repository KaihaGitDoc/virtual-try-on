<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Web AR 試着シミュレーター（サイズ微調整対応）</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        /* サイズ微調整用のスライダーエリア */
        .controls {
            margin: 10px auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }
        label {
            font-size: 14px;
        }
        input[type="range"] {
            width: 220px;
            vertical-align: middle;
            margin-left: 10px;
        }
        #container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video, canvas {
            display: block;
            /* インカメラの場合の左右反転（必要に応じて有効化） */
            transform: scaleX(-1);
            max-width: 100%;
            height: auto;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <h1>Web AR 試着アプリ005</h1>
    
    <div class="controls">
        <label for="scaleRange">画像サイズ微調整: <span id="scaleValue">1.0</span>倍</label><br>
        <input type="range" id="scaleRange" min="0.4" max="2.5" step="0.05" value="1.0">
    </div>

    <div id="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        // スライダー要素の取得
        const scaleRange = document.getElementById('scaleRange');
        const scaleValueText = document.getElementById('scaleValue');

        // ユーザーの手動調整倍率
        let manualScale = 1.0;
        scaleRange.addEventListener('input', (e) => {
            manualScale = parseFloat(e.target.value);
            scaleValueText.textContent = manualScale.toFixed(2);
        });

        // 重ねたい画像（シャツなど）の読み込み
        const tshirtImg = new Image();
        tshirtImg.src = 't-shirt-1976334_1920.png'; // ※ご自身の画像ファイル名に合わせてください
        let isImageLoaded = false;
        tshirtImg.onload = () => {
            isImageLoaded = true;
        };

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // カメラ映像を描画
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks && isImageLoaded) {
                const landmarks = results.poseLandmarks;

                // 左右の肩の座標 (11: 左肩, 12: 右肩)
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];

                const canvasWidth = canvasElement.width;
                const canvasHeight = canvasElement.height;

                // 肩の中点位置（ピクセル座標）
                const shoulderX = (leftShoulder.x + rightShoulder.x) / 2 * canvasWidth;
                const shoulderY = (leftShoulder.y + rightShoulder.y) / 2 * canvasHeight;

                // 肩幅の計算
                const dx = (leftShoulder.x - rightShoulder.x) * canvasWidth;
                const dy = (leftShoulder.y - rightShoulder.y) * canvasHeight;
                const shoulderWidth = Math.sqrt(dx * dx + dy * dy);

                // --- 【ポイント】サイズ計算の調整 ---
                // インカメラで近すぎる場合を考慮し、基準係数を「1.2」程度にやや小さめに設定
                // さらにスライダーの `manualScale` を掛け合わせることで自由に変更可能に
                const baseScaleFactor = 1.2; 
                const targetWidth = shoulderWidth * baseScaleFactor * manualScale;
                const aspectRatio = tshirtImg.height / tshirtImg.width;
                const targetHeight = targetWidth * aspectRatio;

                // 画像の位置調整（肩の中点から少し上に配置して首元に合わせる）
                const offsetX = shoulderX;
                const offsetY = shoulderY - (targetHeight * 0.28); 

                // 描画実行
                canvasCtx.translate(offsetX, offsetY);
                
                // ※もし映像が反転していて画像がズレる場合は、以下のコメントアウトを解除してみてください
                // canvasCtx.scale(-1, 1);

                canvasCtx.drawImage(
                    tshirtImg,
                    -targetWidth / 2,
                    -targetHeight / 2,
                    targetWidth,
                    targetHeight
                );
            }
            canvasCtx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
