<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webブラウザ試着アプリ (MediaPipe Pose)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
        }
        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .btn-container {
            margin: 15px 0;
        }
        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #e64a19;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        video {
            display: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            /* 初期状態（インカメラ）は鏡写しに反転 */
            transform: scaleX(-1);
            transition: transform 0.2s;
        }
    </style>
</head>
<body>

    <h1>👕 試着シミュレーター004</h1>
    <p style="font-size: 0.8rem; color: #aaa;">体にフィットするように調整しました</p>

    <div class="btn-container">
        <button id="switch-camera-btn">📷 カメラ切り替え (イン/アウト)</button>
    </div>

    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <div id="output_canvas_wrapper"></div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.createElement('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        document.getElementById('output_canvas_wrapper').appendChild(canvasElement);

        let currentFacingMode = 'user'; // 'user' (インカメラ) または 'environment' (アウトカメラ)
        let mediaStream = null;

        // 重ねたいTシャツの画像を読み込む
        const tshirtImg = new Image();
        tshirtImg.src = 't-shirt-1976334_1920.png'; // 同じ階層にある画像ファイル名

        function onResults(results) {
            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. カメラの映像をキャンバスに描画
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 2. MediaPipe Pose で骨格（関節）が検出された場合
            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                // 11番(左肩), 12番(右肩)
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];

                if (leftShoulder && rightShoulder && leftShoulder.visibility > 0.5 && rightShoulder.visibility > 0.5) {
                    
                    const x1 = leftShoulder.x * canvasElement.width;
                    const y1 = leftShoulder.y * canvasElement.height;
                    const x2 = rightShoulder.x * canvasElement.width;
                    const y2 = rightShoulder.y * canvasElement.height;

                    // 左右の肩の中点
                    const centerX = (x1 + x2) / 2;
                    const centerY = (y1 + y2) / 2;

                    // 左右の肩の幅
                    const shoulderWidth = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));

                    // Tシャツのサイズ調整
                    const scaleFactor = 2.0; // 肩幅に対する倍率
                    const imgWidth = shoulderWidth * scaleFactor;
                    const imgHeight = (tshirtImg.height / tshirtImg.width) * imgWidth;

                    // 【顔被り防止の修正】肩のライン（centerY）を基準にしつつ、少しだけ上に重ねて首元〜胸元に合わせる
                    const imgX = centerX - (imgWidth / 2);
                    const imgY = centerY - (imgHeight * 0.05); // 以前より下に下げて顔を隠さないようにしました

                    // 3. Tシャツ画像を描画
                    if (tshirtImg.complete && tshirtImg.naturalWidth !== 0) {
                        canvasCtx.drawImage(tshirtImg, imgX, imgY, imgWidth, imgHeight);
                    }
                }
            }
            canvasCtx.restore();
        }

        // MediaPipe Pose の初期設定
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // カメラを起動・切り替える関数
        async function startCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = mediaStream;
                await videoElement.play();

                runPoseDetection();
            } catch (err) {
                console.error("カメラの起動に失敗しました:", err);
                alert("カメラの起動に失敗しました。権限や別アプリでの使用状況をご確認ください。");
            }
        }

        // 映像フレームごとにMediaPipeへ送るループ処理
        function runPoseDetection() {
            if (!mediaStream) return;
            if (videoElement.readyState >= 2) {
                pose.send({ image: videoElement }).then(() => {
                    if (mediaStream) {
                        requestAnimationFrame(runPoseDetection);
                    }
                });
            } else {
                requestAnimationFrame(runPoseDetection);
            }
        }

        // カメラ切り替えボタンが押されたときの処理
        document.getElementById('switch-camera-btn').addEventListener('click', () => {
            // インカメラ('user') と アウトカメラ('environment') を反転
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

            // インカメラの時は左右反転（鏡）、アウトカメラの時はそのまま
            if (currentFacingMode === 'user') {
                canvasElement.style.transform = 'scaleX(-1)';
            } else {
                canvasElement.style.transform = 'scaleX(1)';
            }

            startCamera();
        });

        // ページ読み込み時にカメラを起動
        startCamera();
    </script>
</body>
</html>
