<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>MediaPipe Pose AR Fitting</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; }
        .container { position: relative; width: 640px; height: 480px; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <img id="overlay-img" src="t-shirt-1976334_1920.png" style="display:none;" crossorigin="anonymous" />

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const overlayImg = document.getElementById('overlay-img');

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // 1. カメラの映像を背景として描画
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 2. 人骨格（ランドマーク）が検出された場合
            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                // 左肩(11)と右肩(12)の座標を取得 (値は 0.0〜1.0 の割合)
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];

                // ピクセル座標に変換
                const lsX = leftShoulder.x * canvasElement.width;
                const lsY = leftShoulder.y * canvasElement.height;
                const rsX = rightShoulder.x * canvasElement.width;
                const rsY = rightShoulder.y * canvasElement.height;

                // 肩幅を計算
                const shoulderWidth = Math.sqrt(Math.pow(rsX - lsX, 2) + Math.pow(rsY - lsY, 2));

                // 画像のサイズを肩幅に合わせてスケーリング (例：肩幅の1.5倍の大きさにする)
                const imgWidth = shoulderWidth * 1.5;
                const imgHeight = imgWidth * (overlayImg.height / overlayImg.width); // 縦横比を維持

                // 配置の中心位置（両肩の中点あたり）
                const centerX = (lsX + rsX) / 2;
                const centerY = (lsY + rsY) / 2;

                // 3. 計算したサイズ・位置で画像を重ねて描画
                canvasCtx.drawImage(
                    overlayImg, 
                    centerX - (imgWidth / 2), 
                    centerY - (imgHeight * 0.3), // 少し上にオフセットして首〜胸あたりに合わせる
                    imgWidth, 
                    imgHeight
                );
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
