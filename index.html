<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Web AR 試着シミュレーター</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .controls {
            margin: 10px auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }
        label {
            font-size: 14px;
        }
        input[type="range"] {
            width: 200px;
            vertical-align: middle;
            margin-left: 10px;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #0056b3;
        }
        #container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video {
            display: none; /* ビデオ自体は非表示にし、Canvasに描画します */
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Web AR 試着アプリ006</h1>
    
    <div class="controls">
        <button id="switchCameraBtn">カメラ切り替え (イン/アウト)</button><br><br>
        <label for="scaleRange">画像サイズ微調整: <span id="scaleValue">1.0</span>倍</label><br>
        <input type="range" id="scaleRange" min="0.4" max="2.5" step="0.05" value="1.0">
    </div>

    <div id="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const scaleRange = document.getElementById('scaleRange');
        const scaleValueText = document.getElementById('scaleValue');
        const switchCameraBtn = document.getElementById('switchCameraBtn');

        let manualScale = 1.0;
        scaleRange.addEventListener('input', (e) => {
            manualScale = parseFloat(e.target.value);
            scaleValueText.textContent = manualScale.toFixed(2);
        });

        // 指定された試着画像の設定
        const tshirtImg = new Image();
        tshirtImg.src = 't-shirt-1976334_1920.png';
        let isImageLoaded = false;
        tshirtImg.onload = () => {
            isImageLoaded = true;
        };

        // カメラ設定（初期値：インカメラ 'user'）
        let currentFacingMode = 'user'; 
        let camera = null;

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // インカメラの時は鏡写し（左右反転）、アウトカメラの時はそのまま描画
            canvasCtx.save();
            if (currentFacingMode === 'user') {
                canvasCtx.scale(-1, 1);
                canvasCtx.drawImage(results.image, -canvasElement.width, 0, canvasElement.width, canvasElement.height);
            } else {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            if (results.poseLandmarks && isImageLoaded) {
                const landmarks = results.poseLandmarks;

                // 左右の肩の座標 (11: 左肩, 12: 右肩)
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];

                const canvasWidth = canvasElement.width;
                const canvasHeight = canvasElement.height;

                let shoulderX_left = leftShoulder.x * canvasWidth;
                let shoulderX_right = rightShoulder.x * canvasWidth;

                // 肩の中点位置
                const shoulderX = (shoulderX_left + shoulderX_right) / 2;
                const shoulderY = (leftShoulder.y + rightShoulder.y) / 2 * canvasHeight;

                // 肩幅の計算
                const dx = shoulderX_left - shoulderX_right;
                const dy = (leftShoulder.y - rightShoulder.y) * canvasHeight;
                const shoulderWidth = Math.sqrt(dx * dx + dy * dy);

                // --- サイズ調整 ---
                // インカメラで近すぎる場合を考慮した基本係数（1.1）× スライダーの微調整値
                const baseScaleFactor = 1.1; 
                const targetWidth = shoulderWidth * baseScaleFactor * manualScale;
                const aspectRatio = tshirtImg.height / tshirtImg.width;
                const targetHeight = targetWidth * aspectRatio;

                // 位置調整（首元・胸元に綺麗にフィットするように配置）
                const offsetX = shoulderX;
                const offsetY = shoulderY - (targetHeight * 0.25); 

                canvasCtx.translate(offsetX, offsetY);

                // 試着画像の描画
                canvasCtx.drawImage(
                    tshirtImg,
                    -targetWidth / 2,
                    -targetHeight / 2,
                    targetWidth,
                    targetHeight
                );
            }
            canvasCtx.restore();
            canvasCtx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        function startCamera() {
            if (camera) {
                camera.stop();
            }
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({ image: videoElement });
                },
                width: 640,
                height: 480,
                facingMode: currentFacingMode
            });
            camera.start();
        }

        // カメラ切り替えボタンのクリックイベント
        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera();
        });

        // 初回カメラ起動
        startCamera();
    </script>
</body>
</html>
